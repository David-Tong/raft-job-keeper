server:
  port: 8080
raft:
  data-dir: ${RAFT_DATA_DIR:/data}
  self-address: ${ADVERTISE_ADDR:localhost:7000}
  initial-peers: ${RAFT_INITIAL_PEERS:localhost:7000}
  election-timeout-ms: 1000
  snapshot-interval-secs: 600
management:
  endpoints:
    web:
      exposure:
        include: health,info
